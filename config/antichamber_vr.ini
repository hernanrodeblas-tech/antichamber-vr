; Antichamber VR - configuracion
; Este archivo vive junto a UDK.exe (Binaries\Win32\antichamber_vr.ini).

[VR]
Enabled=1              ; 0 = jugar en plano (se mantiene la correccion de PhysX)
ResolutionScale=1.0    ; multiplicador sobre la resolucion recomendada por SteamVR
MaxRenderWidth=3000    ; limite de anchura por ojo en pixeles (0 = sin limite; bajalo si no llegas a 90 fps)
WorldScale=50          ; unidades Unreal por metro (mas alto = el mundo se ve mas grande)
PlayMode=Standing      ; Standing = de pie (altura real), Seated = sentado (altura fija, se recalibra con el stick derecho)
SeatedEyeHeight=1.65   ; metros, altura de ojos usada en modo sentado
HeightOffset=0.0       ; metros que se suman a tu altura real (util para jugar sentado)
Roomscale=1            ; 1 = caminar fisicamente mueve al personaje
Crosshair=1            ; 1 = punto de apuntado 3D donde senala el arma
NearClip=10            ; plano de recorte cercano (unidades Unreal). 10 = original del juego; su detector de lineas esta ajustado para ese valor
StereoCaptures=1       ; 1 = coloca por ojo las capturas que el juego pinta en pantalla (cristales, lineas)
EyeOcclusionFix=0      ; 1 = el ojo derecho ignora la oclusion heredada del izquierdo (recuadro del bloque)
EyeFrameAdvance=0      ; 1 = cada ojo cuenta como un fotograma del motor (experimental, no necesario)
EyeTileFix=1           ; 1 = el recuadro de colocacion del bloque se dibuja tambien en el ojo derecho
DynamicShadows=1       ; 0 = apaga las sombras dinamicas del juego
LineworkFix=1          ; 1 = ajusta el detector de lineas del juego al FOV del visor (sombras rayadas)
LineworkScale=1.0      ; multiplicador de ese ajuste (menor = menos lineas falsas, mayor = lineas mas gruesas)
ResizeScreenTargets=1  ; 1 = las texturas de espejos/portales se adaptan a la resolucion del visor
CaptureScale=1.0       ; resolucion de espejos/portales respecto al ojo (el juego usa 0.75; bajalo si hay tirones en esas salas)

[Controles]
LeftHanded=0           ; 1 = arma en la mano izquierda, movimiento en el stick derecho
SnapTurn=1             ; 1 = giro por pasos, 0 = giro suave
SnapTurnDegrees=30
SmoothTurnSpeed=120    ; grados por segundo (giro suave)
MoveRelativeToHand=0   ; 0 = avanzar hacia donde miras, 1 = hacia donde apunta la mano de movimiento
StickDeadzone=0.2
AimPitchOffset=0       ; grados; positivo inclina el apuntado hacia abajo
GunOffsetX=0           ; desplazamiento del modelo del arma respecto a la mano (unidades Unreal)
GunOffsetY=0
GunOffsetZ=0
GunScale=1.0           ; tamano del modelo del arma (1 = original)

[Avanzado]
FixPhysX=1             ; fuerza el PhysX 2.8.4.4 del juego (evita el cierre al cargar)
FakeHMD=0              ; modo de pruebas sin visor
DebugDumpFrame=0       ; >0 guarda vr_eye0.jpg / vr_eye1.jpg en ese fotograma estereo
