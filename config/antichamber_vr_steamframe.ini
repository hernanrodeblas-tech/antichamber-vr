; Antichamber VR - configuracion para jugar directamente en las Steam Frame (modo autonomo)
; Copialo a Binaries\Win32\antichamber_vr.ini en la carpeta del juego de las Frame.
; Requiere Proton Experimental y la opcion de lanzamiento WINEDLLOVERRIDES="d3d9=n,b" %command%

[VR]
Enabled=1
ResolutionScale=1.0    ; resolucion recomendada por SteamVR (unos 2000 px por ojo)
MaxRenderWidth=2400
WorldScale=50
PlayMode=Standing      ; Standing = de pie, Seated = sentado
SeatedEyeHeight=1.65
HeightOffset=0.0
Roomscale=1
Crosshair=1
NearClip=10
StereoCaptures=1
EyeOcclusionFix=0
AsymmetricFrustum=1    ; cada ojo dibuja solo su parte del campo de vision (menos pixeles y objetos)
EyeFrameAdvance=0
EyeTileFix=1
DynamicShadows=0       ; las sombras dinamicas son lo que mas cuesta en las Frame
MotionBlur=0
LineworkFix=1
LineworkScale=1.0
ResizeScreenTargets=1
CaptureScale=0.75      ; espejos/portales a 3/4 de la resolucion del ojo

[Controles]
LeftHanded=0
SnapTurn=1
SnapTurnDegrees=30
SmoothTurnSpeed=120
MoveDirection=Head     ; Head = hacia donde miras, Left / Right = hacia donde apunta ese mando
StickDeadzone=0.2
AimPitchOffset=0
GunOffsetX=0
GunOffsetY=0
GunOffsetZ=0
GunScale=1.0

[Avanzado]
FixPhysX=1
PipelineFrames=1       ; CPU y GPU en paralelo: mucho mas fluido en las Frame
CpuCores=2-7           ; nucleos medianos y el rapido (SteamOS arranca el juego en 3-7)
RenderThreadCore=7     ; el hilo de render, el que limita, solo en el nucleo rapido (7); calienta algo mas el visor
D3DBridge=0            ; automatico (en Proton se usa la textura D3D11 compartida)
FakeHMD=0
DebugDumpFrame=0
